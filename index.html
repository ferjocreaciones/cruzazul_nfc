<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruz Azul NFC</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#001a4d,#003DA5,#6FA8FF);
color:white;
text-align:center;
overflow-x:hidden;
}

.container{
padding:20px;
}

.card-fc{
position:relative;
width:90%;
max-width:320px;
height:480px;
margin:20px auto;
border-radius:22px;
overflow:hidden;
box-shadow:0 0 25px rgba(111,168,255,.45);
}

.card-bg{
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(135deg,#003DA5,#FFFFFF);
z-index:1;
}

.card-bg:after{
content:"";
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:
linear-gradient(
120deg,
transparent 20%,
rgba(255,255,255,.20) 40%,
transparent 60%);
animation:shine 6s linear infinite;
}

@keyframes shine{
0%{transform:translateX(-100%) rotate(15deg);}
100%{transform:translateX(100%) rotate(15deg);}
}

.card-player{
position:absolute;
bottom:70px;
left:50%;
transform:translateX(-50%);
width:85%;
max-height:320px;
object-fit:contain;
z-index:2;
}

.card-info{
position:absolute;
bottom:0;
width:100%;
padding:15px;
background:linear-gradient(180deg,transparent,rgba(0,0,0,.88));
z-index:3;
}

.card-name{
font-size:26px;
font-weight:bold;
}

.card-details{
display:flex;
justify-content:center;
gap:15px;
margin-top:5px;
}

.card-details span{
background:rgba(0,0,0,.55);
padding:5px 12px;
border-radius:8px;
}

.player-box{
width:92%;
max-width:420px;
margin:25px auto;
padding:20px;
border-radius:22px;
background:linear-gradient(180deg,rgba(10,10,10,.92),rgba(0,40,120,.92));
}

.player-title{
font-size:28px;
font-weight:bold;
margin-bottom:15px;
color:#FFFFFF;
}

.btn-premium,
.btn{
display:block;
width:90%;
max-width:350px;
margin:12px auto;
padding:16px;
border-radius:18px;
text-decoration:none;
font-weight:bold;
}

.btn-premium{
color:white;
background:linear-gradient(135deg,#002A70,#003DA5,#6FA8FF);
}

.btn{
background:linear-gradient(135deg,#003DA5,#FFFFFF);
color:#111;
}

.separador{
height:8px;
margin:28px 0;
border-radius:4px;
background:linear-gradient(90deg,#003DA5,#FFFFFF,#003DA5);
}

</style>
</head>

<body>

<div class="container">

<div class="card-fc">

<div class="card-bg"></div>

<img id="player-img"
class="card-player"
src="sepulveda.jpg">

<div class="card-info">

<div id="card-name"
class="card-name">

Ángel Sepúlveda

</div>

<div class="card-details">

<span>CAZ</span>
<span>🚂</span>

</div>

</div>

</div>

<div class="player-box">

<div id="premium-title"
class="player-title">

✨ Ángel Sepúlveda Edition

</div>

<a id="btn-instagram"
class="btn-premium"
href="#"
target="_blank">

📸 Instagram Oficial

</a>

<a id="btn-highlights"
class="btn-premium"
href="#"
target="_blank">

🎥 Highlights

</a>

<a id="btn-stats"
class="btn-premium"
href="#"
target="_blank">

📊 Estadísticas

</a>

<a id="btn-titulos"
class="btn-premium"
href="#"
target="_blank">

🏆 Títulos

</a>

</div>

<div class="separador"></div>

<a class="btn"
href="https://cfcruzazul.com/"
target="_blank">

🌐 Sitio Oficial Cruz Azul

</a>

<a class="btn"
href="https://www.youtube.com/@CruzAzul"
target="_blank">

▶️ YouTube Oficial

</a>

<a class="btn"
href="https://www.instagram.com/cruzazul/"
target="_blank">

📸 Instagram Oficial

</a>

<a class="btn"
href="https://www.google.com/search?q=cruz+azul+proximo+partido"
target="_blank">

📅 Próximo Partido

</a>

<div class="separador"></div>

<a class="btn"
href="https://www.google.com/search?q=cruz+azul+calendario"
target="_blank">

🗓️ Calendario

</a>

<a class="btn"
href="https://www.google.com/search?q=tabla+liga+mx"
target="_blank">

📊 Liga MX

</a>

<a class="btn"
href="https://www.google.com/search?q=palmares+cruz+azul"
target="_blank">

🏆 Palmarés

</a>

<a class="btn"
href="https://www.google.com/search?q=cruz+azul+camino+liga+mx"
target="_blank">

🚂 La Máquina

</a>

</div>

<script>

const players={

palavecino:{

name:"Agustín Palavecino",
image:"palavecino.jpg",

instagram:"https://www.instagram.com/agusspalavecino/?hl=es",

highlights:"https://www.youtube.com/results?search_query=palavecino+cruz+azul",

stats:"https://www.google.com/search?q=palavecino+estadisticas",

titles:"https://www.google.com/search?q=palavecino+titulos"

},

rotondi:{

name:"Carlos Rodolfo Rotondi",
image:"rotondi.jpg",

instagram:"https://www.instagram.com/rodorotondi/?hl=es",

highlights:"https://www.youtube.com/results?search_query=rotondi+cruz+azul",

stats:"https://www.google.com/search?q=rotondi+estadisticas",

titles:"https://www.google.com/search?q=rotondi+titulos"

}

};

const params=new URLSearchParams(window.location.search);

const playerKey=params.get("player");

const player=players[playerKey] || players["palavecino"];

document.getElementById("player-img").src=player.image;
document.getElementById("card-name").innerText=player.name;
document.getElementById("premium-title").innerText="✨ " + player.name + " Edition";
document.getElementById("btn-instagram").href=player.instagram;
document.getElementById("btn-highlights").href=player.highlights;
document.getElementById("btn-stats").href=player.stats;
document.getElementById("btn-titulos").href=player.titles;

</script>

</body>
</html>
